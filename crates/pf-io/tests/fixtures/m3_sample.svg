<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- PhotonForge M3 hardware sample: a circle to score (blue) inside a
     30 mm square to cut out (red). The circle comes first, so its layer runs
     first: inner work before the outline that frees the piece. Small, so a
     first cut wastes little material. Stroke only; no fills, text or images. -->
<svg
   width="40mm"
   height="40mm"
   viewBox="0 0 40 40"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <circle
     style="fill:none;stroke:#0000ff;stroke-width:0.1"
     id="score_circle"
     cx="20"
     cy="20"
     r="8" />
  <rect
     style="fill:none;stroke:#ff0000;stroke-width:0.1"
     id="cut_square"
     width="30"
     height="30"
     x="5"
     y="5" />
</svg>
